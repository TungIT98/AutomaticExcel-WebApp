<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to Word Converter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            padding: 40px;
            max-width: 500px;
            width: 100%;
            margin: 20px;
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            color: #666;
            font-size: 1.1em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .upload-area {
            border: 2px dashed #667eea;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .upload-area:hover {
            background-color: #f8f9ff;
        }
        
        .upload-area.dragover {
            background-color: #e8f0ff;
            border-color: #4c63d2;
        }
        
        .progress {
            width: 100%;
            height: 8px;
            background-color: #e1e5e9;
            border-radius: 4px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }
        
        .progress-bar {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s;
        }
        
        .message {
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            display: none;
        }
        
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .login-form {
            display: block;
        }
        
        .upload-form {
            display: none;
        }
        
        .logout-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #dc3545;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Form -->
        <div id="loginForm" class="login-form">
            <div class="header">
                <h1>🔐 Đăng nhập</h1>
                <p>Excel to Word Converter</p>
            </div>
            
            <form id="loginFormElement">
                <div class="form-group">
                    <label for="username">Tên đăng nhập:</label>
                    <input type="text" id="username" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Mật khẩu:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <button type="submit" class="btn">Đăng nhập</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <p style="color: #666; margin-bottom: 10px;">Chưa có tài khoản?</p>
                <button type="button" class="btn" onclick="showRegisterForm()" style="background: #28a745; width: 100%;">
                    📝 Đăng ký tài khoản mới
                </button>
            </div>
            
            <div class="message" id="loginMessage"></div>
        </div>
        
        <!-- Register Form -->
        <div id="registerForm" class="login-form" style="display: none;">
            <div class="header">
                <h1>📝 Đăng ký tài khoản</h1>
                <p>Excel to Word Converter</p>
            </div>
            
            <form id="registerFormElement">
                <div class="form-group">
                    <label for="regUsername">Tên đăng nhập:</label>
                    <input type="text" id="regUsername" name="username" required>
                </div>
                
                <div class="form-group">
                    <label for="regEmail">Email:</label>
                    <input type="email" id="regEmail" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="regPassword">Mật khẩu:</label>
                    <input type="password" id="regPassword" name="password" required>
                </div>
                
                <div class="form-group">
                    <label for="regPasswordConfirm">Xác nhận mật khẩu:</label>
                    <input type="password" id="regPasswordConfirm" name="password_confirm" required>
                </div>
                
                <button type="submit" class="btn">Đăng ký</button>
            </form>
            
            <div style="text-align: center; margin-top: 20px;">
                <p style="color: #666; margin-bottom: 10px;">Đã có tài khoản?</p>
                <button type="button" class="btn" onclick="showLoginForm()" style="background: #667eea; width: 100%;">
                    🔐 Đăng nhập
                </button>
            </div>
            
            <div class="message" id="registerMessage"></div>
        </div>
        
        <!-- Upload Form -->
        <div id="uploadForm" class="upload-form">
            <button class="logout-btn" onclick="logout()">Đăng xuất</button>
            
            <div class="header">
                <h1>📄 Chuyển đổi Excel sang Word</h1>
                <p>Tải lên file Excel để chuyển đổi</p>
            </div>
            
            <div class="upload-area" id="uploadArea">
                <input type="file" id="fileInput" accept=".xlsx,.xls" style="display: none;">
                <div>
                    <h3>📁 Kéo thả file Excel vào đây</h3>
                    <p>hoặc <span style="color: #667eea; cursor: pointer;" onclick="document.getElementById('fileInput').click()">chọn file</span></p>
                    <p style="color: #666; font-size: 0.9em; margin-top: 10px;">Chỉ hỗ trợ file .xlsx và .xls</p>
                </div>
            </div>
            
            <div class="progress" id="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <button class="btn" id="convertBtn" onclick="convertFile()" disabled>
                🔄 Chuyển đổi
            </button>
            
            <div class="message" id="message"></div>
        </div>
    </div>

    <script>
        let currentUser = null;
        let selectedFile = null;
        
        // Check if user is already logged in
        window.onload = function() {
            const token = localStorage.getItem('token');
            if (token) {
                showUploadForm();
            }
        };
        
        // Login form handler
        document.getElementById('loginFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    currentUser = data;
                    showUploadForm();
                } else {
                    showMessage('loginMessage', data.error, 'error');
                }
            } catch (error) {
                showMessage('loginMessage', 'Lỗi kết nối: ' + error.message, 'error');
            }
        });
        
        // Register form handler
        document.getElementById('registerFormElement').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('regUsername').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const passwordConfirm = document.getElementById('regPasswordConfirm').value;
            
            // Validate passwords match
            if (password !== passwordConfirm) {
                showMessage('registerMessage', 'Mật khẩu xác nhận không khớp!', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, email, password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('registerMessage', 'Đăng ký thành công! Vui lòng chờ admin duyệt tài khoản.', 'success');
                    // Auto switch to login form after 2 seconds
                    setTimeout(() => {
                        showLoginForm();
                    }, 2000);
                } else {
                    showMessage('registerMessage', data.error, 'error');
                }
            } catch (error) {
                showMessage('registerMessage', 'Lỗi kết nối: ' + error.message, 'error');
            }
        });
        
        // File upload handlers
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        
        uploadArea.addEventListener('click', () => fileInput.click());
        
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFileSelect(files[0]);
            }
        });
        
        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                handleFileSelect(e.target.files[0]);
            }
        });
        
        function handleFileSelect(file) {
            if (!file.name.toLowerCase().endsWith('.xlsx') && !file.name.toLowerCase().endsWith('.xls')) {
                showMessage('message', 'Chỉ hỗ trợ file Excel (.xlsx, .xls)', 'error');
                return;
            }
            
            selectedFile = file;
            uploadArea.innerHTML = `
                <h3>✅ File đã chọn</h3>
                <p><strong>${file.name}</strong></p>
                <p style="color: #666; font-size: 0.9em;">Kích thước: ${(file.size / 1024 / 1024).toFixed(2)} MB</p>
            `;
            document.getElementById('convertBtn').disabled = false;
        }
        
        async function convertFile() {
            if (!selectedFile) return;
            
            const formData = new FormData();
            formData.append('file', selectedFile);
            
            const progress = document.getElementById('progress');
            const progressBar = document.getElementById('progressBar');
            const convertBtn = document.getElementById('convertBtn');
            
            progress.style.display = 'block';
            convertBtn.disabled = true;
            convertBtn.textContent = '🔄 Đang xử lý...';
            
            try {
                const response = await fetch('/api/convert', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    showMessage('message', 'Chuyển đổi thành công! Đang tải file...', 'success');
                    
                    // Download the result
                    setTimeout(() => {
                        window.open(`/api/download/${data.conversion_id}`, '_blank');
                    }, 1000);
                } else {
                    if (data.code === 'NO_LICENSE') {
                        showMessage('message', 'Bạn chưa được cấp quyền sử dụng. Vui lòng liên hệ admin.', 'error');
                    } else {
                        showMessage('message', 'Lỗi: ' + data.error, 'error');
                    }
                }
            } catch (error) {
                showMessage('message', 'Lỗi kết nối: ' + error.message, 'error');
            } finally {
                progress.style.display = 'none';
                convertBtn.disabled = false;
                convertBtn.textContent = '🔄 Chuyển đổi';
            }
        }
        
        function showUploadForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('uploadForm').style.display = 'block';
        }
        
        function showLoginForm() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('uploadForm').style.display = 'none';
        }
        
        function showRegisterForm() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.getElementById('uploadForm').style.display = 'none';
        }
        
        function logout() {
            localStorage.removeItem('token');
            currentUser = null;
            showLoginForm();
            document.getElementById('loginFormElement').reset();
            document.getElementById('registerFormElement').reset();
        }
        
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.textContent = message;
            element.className = `message ${type}`;
            element.style.display = 'block';
            
            setTimeout(() => {
                element.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
